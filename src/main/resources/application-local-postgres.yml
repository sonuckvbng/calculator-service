spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:calcplay}
    username: ${DB_USERNAME:calcplay}
    password: ${DB_PASSWORD:calcplay-local-only}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
